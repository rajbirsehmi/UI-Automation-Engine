name: Build and Release AAR

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'engine-lint/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'release-notes.md'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'engine-lint/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'release-notes.md'
      - '.github/workflows/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit and Lint Tests
        run: ./gradlew :engine:test :engine-lint:test

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo usermod -aG kvm $USER
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :engine:connectedStandardDebugAndroidTest :engine:connectedHiltDebugAndroidTest

      - name: Upload Test Failure Reports & Diagnostic Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-failure-reports
          path: |
            engine/build/reports/androidTests/
            engine/build/outputs/connected_android_test_additional_output/
            **/FAILURE_*
            **/GLOBAL_FAILURE_*
            **/ADVANCED_ACTION_FAILURE_*
          if-no-files-found: ignore

      - name: Build Artifacts
        run: ./gradlew :engine:assembleRelease :engine-lint:assemble

      - name: Verify Artifacts
        run: |
          ls -R engine/build/outputs/aar/
          ls -R engine-lint/build/libs/
          if [ ! -f engine/build/outputs/aar/engine-standard-release.aar ]; then echo "Standard AAR missing"; exit 1; fi
          if [ ! -f engine/build/outputs/aar/engine-hilt-release.aar ]; then echo "Hilt AAR missing"; exit 1; fi
          if [ ! -f engine-lint/build/libs/engine-lint.jar ]; then echo "Lint JAR missing"; exit 1; fi

      - name: Extract Version
        id: get_version
        run: |
          # Extracts the version string from the publishing block in engine/build.gradle.kts
          VERSION=$(grep -m 1 "version =" engine/build.gradle.kts | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') }}
          files: |
            engine/build/outputs/aar/engine-standard-release.aar
            engine/build/outputs/aar/engine-hilt-release.aar
            engine-lint/build/libs/engine-lint.jar
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping JitPack
        run: |
          # Trigger JitPack to start building the new release automatically
          TAG_NAME="${{ steps.get_version.outputs.VERSION }}"
          echo "Pinging JitPack for $TAG_NAME..."
          curl -s "https://jitpack.io/api/builds/com.github.rajbirsehmi/UI-Automation-Engine/$TAG_NAME" > /dev/null
